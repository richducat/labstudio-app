name: Deploy Lab Studio to Namecheap

on:
  workflow_dispatch:

concurrency:
  group: labstudio-namecheap-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labstudio-app
    env:
      NAMECHEAP_FTP_HOST: ${{ secrets.NAMECHEAP_FTP_HOST }}
      NAMECHEAP_FTP_PORT: ${{ secrets.NAMECHEAP_FTP_PORT }}
      NAMECHEAP_FTP_USER: ${{ secrets.NAMECHEAP_FTP_USER }}
      NAMECHEAP_FTP_PASS: ${{ secrets.NAMECHEAP_FTP_PASS }}
      NAMECHEAP_SSH_HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
      NAMECHEAP_SSH_PORT: ${{ secrets.NAMECHEAP_SSH_PORT }}
      NAMECHEAP_CPANEL_USER: ${{ secrets.NAMECHEAP_CPANEL_USER }}
      NAMECHEAP_REMOTE_ABS_ROOT: ${{ secrets.NAMECHEAP_REMOTE_ABS_ROOT }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LABSTUDIO_ACCESS_CODE: ${{ secrets.LABSTUDIO_ACCESS_CODE }}
      LABSTUDIO_BOOKINGS_ICAL_URL: ${{ secrets.LABSTUDIO_BOOKINGS_ICAL_URL }}
      LABSTUDIO_SESSION_SECRET: ${{ secrets.LABSTUDIO_SESSION_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      TOBY_AI_PROVIDER: ${{ secrets.TOBY_AI_PROVIDER }}
      TOBY_CHAT_WRAPPER_URL: ${{ secrets.TOBY_CHAT_WRAPPER_URL }}
      TOBY_MODEL: ${{ secrets.TOBY_MODEL }}
      USDA_FDC_API_KEY: ${{ secrets.USDA_FDC_API_KEY }}
      NEXT_PUBLIC_SITE_URL: https://app.labstudio.fit
      SITE_URL: https://app.labstudio.fit
      APP_BASE_URL: https://app.labstudio.fit
      NAMECHEAP_ENV_FILE: ${{ github.workspace }}/labstudio-app/.deploy-env
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: labstudio-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check app
        run: |
          npm run lint
          npm run build

      - name: Write deployment env
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const keys = [
            'APP_BASE_URL',
            'DATABASE_URL',
            'LABSTUDIO_ACCESS_CODE',
            'LABSTUDIO_BOOKINGS_ICAL_URL',
            'LABSTUDIO_SESSION_SECRET',
            'NEXT_PUBLIC_SITE_URL',
            'OPENAI_API_KEY',
            'SITE_URL',
            'STRIPE_SECRET_KEY',
            'TOBY_AI_PROVIDER',
            'TOBY_CHAT_WRAPPER_URL',
            'TOBY_MODEL',
            'USDA_FDC_API_KEY',
          ];
          const lines = [];
          for (const key of keys) {
            const value = process.env[key];
            if (value) {
              lines.push(`${key}=${JSON.stringify(String(value).replace(/\n/g, '\\n'))}`);
            }
          }
          fs.writeFileSync(process.env.NAMECHEAP_ENV_FILE, `${lines.join('\n')}\n`);
          NODE

      - name: Package Namecheap bundle
        run: npm run package:namecheap

      - name: Stage changed runtime files
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const src = path.resolve('output/namecheap-deploy');
          const stage = path.resolve('output/namecheap-targeted');
          fs.rmSync(stage, { recursive: true, force: true });
          fs.mkdirSync(stage, { recursive: true });

          const files = new Set([
            'DEPLOY_INFO.json',
            'app.js',
            '.env.production.local',
            '.next/BUILD_ID',
            '.next/server/app-paths-manifest.json',
            '.next/server/functions-config-manifest.json',
            '.next/server/middleware-build-manifest.js',
            '.next/server/middleware-manifest.json',
            '.next/server/middleware.js',
            '.next/server/next-font-manifest.js',
            '.next/server/next-font-manifest.json',
            '.next/server/pages-manifest.json',
            '.next/server/server-reference-manifest.js',
            '.next/server/server-reference-manifest.json',
          ]);

          function addTree(relativeDir) {
            const absoluteDir = path.join(src, relativeDir);
            if (!fs.existsSync(absoluteDir)) return;
            for (const entry of fs.readdirSync(absoluteDir, { withFileTypes: true })) {
              const relativePath = path.join(relativeDir, entry.name);
              const absolutePath = path.join(src, relativePath);
              if (entry.isDirectory()) {
                addTree(relativePath);
              } else if (entry.isFile()) {
                files.add(relativePath);
              }
            }
          }

          for (const dir of [
            '.next/server/app/api/lab',
            '.next/server/app/api/toby',
            '.next/server/chunks',
            '.next/server/chunks/ssr',
            'data',
            'tmp',
          ]) {
            addTree(dir);
          }

          let copied = 0;
          for (const relativePath of files) {
            const from = path.join(src, relativePath);
            if (!fs.existsSync(from)) continue;
            const to = path.join(stage, relativePath);
            fs.mkdirSync(path.dirname(to), { recursive: true });
            fs.copyFileSync(from, to);
            copied += 1;
          }

          console.log(`Staged ${copied} files for targeted upload.`);
          NODE
          du -sh output/namecheap-targeted

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Upload to Namecheap
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "$NAMECHEAP_FTP_USER","$NAMECHEAP_FTP_PASS" -p "$NAMECHEAP_FTP_PORT" "$NAMECHEAP_FTP_HOST" <<'LFTP'
          set cmd:fail-exit yes
          set net:timeout 60
          set net:max-retries 5
          set net:reconnect-interval-base 5
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set ssl:verify-certificate no
          set xfer:clobber true
          lcd output/namecheap-targeted
          mirror -R --parallel=1 --continue --only-newer --no-perms --no-umask . /app.labstudio.fit
          put -O /app.labstudio.fit/tmp tmp/restart.txt
          bye
          LFTP

      - name: Restart Passenger app over SSH
        shell: bash
        run: |
          set -euo pipefail
          key_path="$(mktemp)"
          trap 'rm -f "$key_path"' EXIT
          printf '%s\n' "${{ secrets.NAMECHEAP_SSH_KEY }}" > "$key_path"
          chmod 600 "$key_path"
          ssh -i "$key_path" \
            -p "$NAMECHEAP_SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$NAMECHEAP_CPANEL_USER@$NAMECHEAP_SSH_HOST" \
            "set -e;
             mkdir -p '$NAMECHEAP_REMOTE_ABS_ROOT/tmp';
             date -u +%FT%TZ > '$NAMECHEAP_REMOTE_ABS_ROOT/tmp/restart.txt';
             if command -v cloudlinux-selector >/dev/null 2>&1; then
               cloudlinux-selector restart --json --interpreter nodejs --user '$NAMECHEAP_CPANEL_USER' --app-root app.labstudio.fit ||
               cloudlinux-selector restart --json --interpreter nodejs --domain app.labstudio.fit --app-root app.labstudio.fit ||
               true;
             fi"

      - name: Verify live API
        run: |
          curl --fail --show-error --location "https://app.labstudio.fit/privacy?deploy=${GITHUB_RUN_ID}" >/dev/null
          curl --fail --show-error --location "https://app.labstudio.fit/support?deploy=${GITHUB_RUN_ID}" >/dev/null
          node <<'NODE'
          const url = `https://app.labstudio.fit/api/lab/services?deploy=${process.env.GITHUB_RUN_ID}`;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          for (let attempt = 1; attempt <= 30; attempt += 1) {
            const response = await fetch(url, { cache: 'no-store' });
            const text = await response.text();
            let parsed = null;
            try {
              parsed = JSON.parse(text);
            } catch {}

            if (response.ok && parsed?.ok && Array.isArray(parsed.services)) {
              console.log(`services ${parsed.services.length}`);
              process.exit(0);
            }

            console.log(`Waiting for Passenger restart, attempt ${attempt}/30, status ${response.status}`);
            await sleep(10000);
          }

          throw new Error('Live /api/lab/services did not expose public services after restart window.');
          NODE
