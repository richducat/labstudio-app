name: Deploy Lab Studio to Namecheap

on:
  workflow_dispatch:
    inputs:
      verified_native_release:
        description: 'App Store version with verified-email login has passed release validation'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: labstudio-namecheap-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labstudio-app
    env:
      NAMECHEAP_FTP_HOST: ${{ secrets.NAMECHEAP_FTP_HOST }}
      NAMECHEAP_FTP_PORT: ${{ secrets.NAMECHEAP_FTP_PORT }}
      NAMECHEAP_FTP_USER: ${{ secrets.NAMECHEAP_FTP_USER }}
      NAMECHEAP_FTP_PASS: ${{ secrets.NAMECHEAP_FTP_PASS }}
      NAMECHEAP_CPANEL_USER: ${{ secrets.NAMECHEAP_CPANEL_USER }}
      NAMECHEAP_REMOTE_ABS_ROOT: ${{ secrets.NAMECHEAP_REMOTE_ABS_ROOT }}
      NAMECHEAP_SSH_HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
      NAMECHEAP_SSH_KEY: ${{ secrets.NAMECHEAP_SSH_KEY }}
      NAMECHEAP_SSH_KNOWN_HOSTS: ${{ secrets.NAMECHEAP_SSH_KNOWN_HOSTS }}
      NAMECHEAP_SSH_PORT: ${{ secrets.NAMECHEAP_SSH_PORT }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LABSTUDIO_ACCESS_CODE: ${{ secrets.LABSTUDIO_ACCESS_CODE }}
      LABSTUDIO_BOOKINGS_ICAL_URL: ${{ secrets.LABSTUDIO_BOOKINGS_ICAL_URL }}
      LABSTUDIO_SESSION_SECRET: ${{ secrets.LABSTUDIO_SESSION_SECRET }}
      LABSTUDIO_SMTP_HOST: ${{ secrets.LABSTUDIO_SMTP_HOST }}
      LABSTUDIO_SMTP_PORT: ${{ secrets.LABSTUDIO_SMTP_PORT }}
      LABSTUDIO_SMTP_USER: ${{ secrets.LABSTUDIO_SMTP_USER }}
      LABSTUDIO_SMTP_PASSWORD: ${{ secrets.LABSTUDIO_SMTP_PASSWORD }}
      LABSTUDIO_LOGIN_FROM: ${{ secrets.LABSTUDIO_LOGIN_FROM }}

      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      TOBY_AI_PROVIDER: ${{ secrets.TOBY_AI_PROVIDER }}
      TOBY_CHAT_WRAPPER_URL: ${{ secrets.TOBY_CHAT_WRAPPER_URL }}
      TOBY_MODEL: ${{ secrets.TOBY_MODEL }}
      USDA_FDC_API_KEY: ${{ secrets.USDA_FDC_API_KEY }}
      NEXT_PUBLIC_SITE_URL: https://app.labstudio.fit
      SITE_URL: https://app.labstudio.fit
      APP_BASE_URL: https://app.labstudio.fit
      NAMECHEAP_ENV_FILE: ${{ github.workspace }}/labstudio-app/.deploy-env
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: labstudio-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify secure sign-in release prerequisites
        env:
          VERIFIED_NATIVE_RELEASE: ${{ inputs.verified_native_release }}
        run: node scripts/check-secure-login-release.mjs

      - name: Check app
        run: |
          npm run test:auth
          npm run lint
          npm run build

      - name: Write deployment env
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const keys = [
            'APP_BASE_URL',
            'DATABASE_URL',
            'LABSTUDIO_ACCESS_CODE',
            'LABSTUDIO_BOOKINGS_ICAL_URL',
            'LABSTUDIO_SESSION_SECRET',
            'LABSTUDIO_SMTP_HOST',
            'LABSTUDIO_SMTP_PORT',
            'LABSTUDIO_SMTP_USER',
            'LABSTUDIO_SMTP_PASSWORD',
            'LABSTUDIO_LOGIN_FROM',

            'NEXT_PUBLIC_SITE_URL',
            'OPENAI_API_KEY',
            'SITE_URL',
            'STRIPE_SECRET_KEY',
            'TOBY_AI_PROVIDER',
            'TOBY_CHAT_WRAPPER_URL',
            'TOBY_MODEL',
            'USDA_FDC_API_KEY',
          ];
          const lines = [];
          for (const key of keys) {
            const value = process.env[key];
            if (value) {
              lines.push(`${key}=${JSON.stringify(String(value).replace(/\n/g, '\\n'))}`);
            }
          }
          fs.writeFileSync(process.env.NAMECHEAP_ENV_FILE, `${lines.join('\n')}\n`);
          NODE

      - name: Package Namecheap bundle
        run: npm run package:namecheap

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Upload to Namecheap
        shell: bash
        run: |
          set -euo pipefail
          remote_root="${NAMECHEAP_REMOTE_ABS_ROOT:-/home/${NAMECHEAP_CPANEL_USER}/app.labstudio.fit}"
          ssh_port="${NAMECHEAP_SSH_PORT:-22}"
          key_path="$RUNNER_TEMP/namecheap_sftp_key"
          known_hosts_path="$RUNNER_TEMP/namecheap_known_hosts"
          umask 077
          trap 'rm -f "$key_path" "$known_hosts_path" "$NAMECHEAP_ENV_FILE"' EXIT

          if [[ -z "${NAMECHEAP_CPANEL_USER:-}" || -z "${NAMECHEAP_SSH_HOST:-}" || -z "${NAMECHEAP_SSH_KEY:-}" || -z "${NAMECHEAP_SSH_KNOWN_HOSTS:-}" ]]; then
            echo "Missing Namecheap SFTP credentials or pinned known-hosts data." >&2
            exit 1
          fi

          printf '%s\n' "$NAMECHEAP_SSH_KEY" > "$key_path"
          chmod 600 "$key_path"
          printf '%s\n' "$NAMECHEAP_SSH_KNOWN_HOSTS" > "$known_hosts_path"
          chmod 600 "$known_hosts_path"
          printf 'restart=%s\n' "$(date -u +%FT%TZ)" > output/namecheap-deploy/tmp/restart.txt

          lftp -u "$NAMECHEAP_CPANEL_USER", "sftp://$NAMECHEAP_SSH_HOST:$ssh_port" <<LFTP
          set cmd:fail-exit yes
          set sftp:connect-program "ssh -a -x -i $key_path -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts_path"
          set net:timeout 60
          set net:max-retries 5
          set net:reconnect-interval-base 5
          set xfer:clobber true
          set mirror:overwrite true
          set cmd:fail-exit no
          mkdir "$remote_root"
          mkdir "$remote_root/tmp"
          set cmd:fail-exit yes
          lcd output/namecheap-deploy
          mirror -R --parallel=1 --transfer-all --no-perms --no-umask . "$remote_root"
          put -O "$remote_root/tmp" tmp/restart.txt
          cat "$remote_root/DEPLOY_INFO.json"
          bye
          LFTP

      - name: Verify live API
        run: |
          curl --fail --show-error --max-time 20 --location "https://app.labstudio.fit/privacy?deploy=${GITHUB_RUN_ID}" >/dev/null
          curl --fail --show-error --max-time 20 --location "https://app.labstudio.fit/support?deploy=${GITHUB_RUN_ID}" >/dev/null
          node <<'NODE'
          const base = 'https://app.labstudio.fit';
          const url = `${base}/api/lab/shop?deploy=${process.env.GITHUB_RUN_ID}`;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function fetchText(target, options = {}) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 20000);
            try {
              const response = await fetch(target, { ...options, signal: controller.signal, cache: 'no-store' });
              return { response, text: await response.text() };
            } finally {
              clearTimeout(timer);
            }
          }

          async function parseJson(target, options = {}) {
            const { response, text } = await fetchText(target, options);
            let parsed = null;
            try {
              parsed = JSON.parse(text);
            } catch {}
            return { response, parsed, text };
          }

          for (let attempt = 1; attempt <= 12; attempt += 1) {
            const { response, parsed } = await parseJson(url);

            if (
              response.ok &&
              parsed?.ok &&
              Array.isArray(parsed.products) &&
              Array.isArray(parsed.services) &&
              parsed.services.length > 0
            ) {
              console.log(`shop ${parsed.products.length}; services ${parsed.services.length}`);
              break;
            }

            if (attempt === 12) {
              throw new Error(`Live /api/lab/shop did not expose native catalog payload. status=${response.status}`);
            }

            console.log(`Waiting for native catalog route, attempt ${attempt}/12, status ${response.status}`);
            await sleep(10000);
          }

          const login = await parseJson(`${base}/api/lab/shop`, {
            method: 'POST',
            headers: { 'content-type': 'application/json', accept: 'application/json' },
            body: JSON.stringify({ action: 'login', email: 'security-probe@example.invalid' }),
          });
          if (login.response.ok || login.parsed?.ok || login.response.headers.has('set-cookie')) {
            throw new Error('Contact-only login must fail without issuing cookies.');
          }
          const user = await parseJson(`${base}/api/lab/user`, {
            headers: { cookie: 'labstudio_uid=security-probe-invalid' },
          });
          if (user.response.status !== 401) throw new Error('Unsigned UID must not authenticate.');
          console.log('Public catalog available; contact-only login and unsigned UID rejected.');
          NODE
