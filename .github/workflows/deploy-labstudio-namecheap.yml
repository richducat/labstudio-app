name: Deploy Lab Studio to Namecheap

on:
  workflow_dispatch:

concurrency:
  group: labstudio-namecheap-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labstudio-app
    env:
      NAMECHEAP_FTP_HOST: ${{ secrets.NAMECHEAP_FTP_HOST }}
      NAMECHEAP_FTP_PORT: ${{ secrets.NAMECHEAP_FTP_PORT }}
      NAMECHEAP_FTP_USER: ${{ secrets.NAMECHEAP_FTP_USER }}
      NAMECHEAP_FTP_PASS: ${{ secrets.NAMECHEAP_FTP_PASS }}
      NAMECHEAP_REMOTE_ABS_ROOT: ${{ secrets.NAMECHEAP_REMOTE_ABS_ROOT }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LABSTUDIO_ACCESS_CODE: ${{ secrets.LABSTUDIO_ACCESS_CODE }}
      LABSTUDIO_BOOKINGS_ICAL_URL: ${{ secrets.LABSTUDIO_BOOKINGS_ICAL_URL }}
      LABSTUDIO_SESSION_SECRET: ${{ secrets.LABSTUDIO_SESSION_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      TOBY_AI_PROVIDER: ${{ secrets.TOBY_AI_PROVIDER }}
      TOBY_CHAT_WRAPPER_URL: ${{ secrets.TOBY_CHAT_WRAPPER_URL }}
      TOBY_MODEL: ${{ secrets.TOBY_MODEL }}
      USDA_FDC_API_KEY: ${{ secrets.USDA_FDC_API_KEY }}
      NEXT_PUBLIC_SITE_URL: https://app.labstudio.fit
      SITE_URL: https://app.labstudio.fit
      APP_BASE_URL: https://app.labstudio.fit
      NAMECHEAP_ENV_FILE: ${{ github.workspace }}/labstudio-app/.deploy-env
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: labstudio-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check app
        run: |
          npm run lint
          npm run build

      - name: Write deployment env
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const keys = [
            'APP_BASE_URL',
            'DATABASE_URL',
            'LABSTUDIO_ACCESS_CODE',
            'LABSTUDIO_BOOKINGS_ICAL_URL',
            'LABSTUDIO_SESSION_SECRET',
            'NEXT_PUBLIC_SITE_URL',
            'OPENAI_API_KEY',
            'SITE_URL',
            'STRIPE_SECRET_KEY',
            'TOBY_AI_PROVIDER',
            'TOBY_CHAT_WRAPPER_URL',
            'TOBY_MODEL',
            'USDA_FDC_API_KEY',
          ];
          const lines = [];
          for (const key of keys) {
            const value = process.env[key];
            if (value) {
              lines.push(`${key}=${JSON.stringify(String(value).replace(/\n/g, '\\n'))}`);
            }
          }
          fs.writeFileSync(process.env.NAMECHEAP_ENV_FILE, `${lines.join('\n')}\n`);
          NODE

      - name: Package Namecheap bundle
        run: npm run package:namecheap

      - name: Stage changed runtime files
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const src = path.resolve('output/namecheap-deploy');
          const stage = path.resolve('output/namecheap-targeted');
          fs.rmSync(stage, { recursive: true, force: true });
          fs.mkdirSync(stage, { recursive: true });

          const files = new Set([
            'DEPLOY_INFO.json',
            'app.js',
            '.env.production.local',
            '.next/BUILD_ID',
            '.next/server/app-paths-manifest.json',
            '.next/server/functions-config-manifest.json',
            '.next/server/middleware-build-manifest.js',
            '.next/server/middleware-manifest.json',
            '.next/server/middleware.js',
            '.next/server/next-font-manifest.js',
            '.next/server/next-font-manifest.json',
            '.next/server/pages-manifest.json',
            '.next/server/server-reference-manifest.js',
            '.next/server/server-reference-manifest.json',
          ]);

          function addTree(relativeDir) {
            const absoluteDir = path.join(src, relativeDir);
            if (!fs.existsSync(absoluteDir)) return;
            for (const entry of fs.readdirSync(absoluteDir, { withFileTypes: true })) {
              const relativePath = path.join(relativeDir, entry.name);
              const absolutePath = path.join(src, relativePath);
              if (entry.isDirectory()) {
                addTree(relativePath);
              } else if (entry.isFile()) {
                files.add(relativePath);
              }
            }
          }

          for (const dir of [
            '.next/server/app/api/lab',
            '.next/server/app/api/toby',
            '.next/server/chunks',
            '.next/server/chunks/ssr',
            'data',
            'tmp',
          ]) {
            addTree(dir);
          }

          let copied = 0;
          for (const relativePath of files) {
            const from = path.join(src, relativePath);
            if (!fs.existsSync(from)) continue;
            const to = path.join(stage, relativePath);
            fs.mkdirSync(path.dirname(to), { recursive: true });
            fs.copyFileSync(from, to);
            copied += 1;
          }

          console.log(`Staged ${copied} files for targeted upload.`);
          NODE
          du -sh output/namecheap-targeted

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Upload to Namecheap
        shell: bash
        run: |
          set -euo pipefail
          expected_marker="$(node -p 'require("./output/namecheap-targeted/DEPLOY_INFO.json").packagedAt')"

          candidates=(
            "app.labstudio.fit"
            "/app.labstudio.fit"
            "public_html/app.labstudio.fit"
            "/public_html/app.labstudio.fit"
          )
          if [[ -n "${NAMECHEAP_REMOTE_ABS_ROOT:-}" ]]; then
            candidates+=("$NAMECHEAP_REMOTE_ABS_ROOT")
          fi

          live_root=""
          for remote_root in "${candidates[@]}"; do
            [[ -n "$remote_root" ]] || continue
            echo "Probing Namecheap upload target with ${#remote_root} characters"
            if ! lftp -u "$NAMECHEAP_FTP_USER","$NAMECHEAP_FTP_PASS" -p "$NAMECHEAP_FTP_PORT" "$NAMECHEAP_FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:timeout 60
          set net:max-retries 3
          set net:reconnect-interval-base 5
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set ssl:verify-certificate no
          set xfer:clobber true
          mkdir -p "$remote_root/tmp"
          put -O "$remote_root" output/namecheap-targeted/DEPLOY_INFO.json
          put -O "$remote_root/tmp" output/namecheap-targeted/tmp/restart.txt
          bye
          LFTP
            then
              continue
            fi

            live_marker="$(
              curl --silent --show-error --max-time 20 --location "https://app.labstudio.fit/DEPLOY_INFO.json?probe=${GITHUB_RUN_ID}" |
                node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{try{console.log(JSON.parse(s).packagedAt||'')}catch{console.log('')}})"
            )"

            if [[ "$live_marker" == "$expected_marker" ]]; then
              live_root="$remote_root"
              break
            fi
          done

          if [[ -z "$live_root" ]]; then
            echo "No Namecheap upload target updated the live DEPLOY_INFO marker." >&2
            exit 1
          fi

          echo "Live Namecheap root selected with ${#live_root} characters"
          lftp -u "$NAMECHEAP_FTP_USER","$NAMECHEAP_FTP_PASS" -p "$NAMECHEAP_FTP_PORT" "$NAMECHEAP_FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:timeout 60
          set net:max-retries 5
          set net:reconnect-interval-base 5
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set ssl:verify-certificate no
          set xfer:clobber true
          set mirror:overwrite true
          lcd output/namecheap-targeted
          mkdir -p "$live_root/tmp"
          mirror -R --parallel=1 --transfer-all --no-perms --no-umask . "$live_root"
          put -O "$live_root/tmp" tmp/restart.txt
          cat "$live_root/DEPLOY_INFO.json"
          bye
          LFTP

      - name: Verify live API
        run: |
          curl --fail --show-error --max-time 20 --location "https://app.labstudio.fit/privacy?deploy=${GITHUB_RUN_ID}" >/dev/null
          curl --fail --show-error --max-time 20 --location "https://app.labstudio.fit/support?deploy=${GITHUB_RUN_ID}" >/dev/null
          node <<'NODE'
          const base = 'https://app.labstudio.fit';
          const url = `${base}/api/lab/shop?deploy=${process.env.GITHUB_RUN_ID}`;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function fetchText(target, options = {}) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 20000);
            try {
              const response = await fetch(target, { ...options, signal: controller.signal, cache: 'no-store' });
              return { response, text: await response.text() };
            } finally {
              clearTimeout(timer);
            }
          }

          async function parseJson(target, options = {}) {
            const { response, text } = await fetchText(target, options);
            let parsed = null;
            try {
              parsed = JSON.parse(text);
            } catch {}
            return { response, parsed, text };
          }

          for (let attempt = 1; attempt <= 12; attempt += 1) {
            const { response, parsed } = await parseJson(url);

            if (
              response.ok &&
              parsed?.ok &&
              Array.isArray(parsed.products) &&
              Array.isArray(parsed.services) &&
              parsed.services.length > 0
            ) {
              console.log(`shop ${parsed.products.length}; services ${parsed.services.length}`);
              break;
            }

            if (attempt === 12) {
              throw new Error(`Live /api/lab/shop did not expose native catalog payload. status=${response.status}`);
            }

            console.log(`Waiting for native catalog route, attempt ${attempt}/12, status ${response.status}`);
            await sleep(10000);
          }

          const login = await parseJson(`${base}/api/lab/shop`, {
            method: 'POST',
            headers: { 'content-type': 'application/json', accept: 'application/json' },
            body: JSON.stringify({
              action: 'login',
              email: `native-ci+${process.env.GITHUB_RUN_ID}@labstudio.fit`,
            }),
          });

          if (!login.response.ok || !login.parsed?.ok) {
            throw new Error(`Native compatibility login failed. status=${login.response.status} body=${login.text.slice(0, 160)}`);
          }

          const setCookies = typeof login.response.headers.getSetCookie === 'function'
            ? login.response.headers.getSetCookie()
            : [login.response.headers.get('set-cookie')].filter(Boolean);
          const cookieHeader = setCookies
            .flatMap((value) => String(value).split(/,(?=\s*labstudio_)/))
            .map((value) => value.match(/labstudio_(?:uid|session)=[^;]+/)?.[0])
            .filter(Boolean)
            .join('; ');

          if (!cookieHeader.includes('labstudio_uid=') || !cookieHeader.includes('labstudio_session=')) {
            throw new Error('Native compatibility login did not return both auth cookies.');
          }

          const user = await parseJson(`${base}/api/lab/user?deploy=${process.env.GITHUB_RUN_ID}`, {
            headers: { accept: 'application/json', cookie: cookieHeader },
          });

          if (!user.response.ok || !user.parsed?.ok || !user.parsed?.user?.id) {
            throw new Error(`Authenticated user check failed. status=${user.response.status} body=${user.text.slice(0, 160)}`);
          }

          console.log(`native login ok ${user.parsed.user.id}`);
          NODE
